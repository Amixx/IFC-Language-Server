[workspace]
members = [".", "crates/schema-model", "tools/schema-model-gen"]
resolver = "2"

[package]
name = "ifc-language-server"
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
serde.workspace = true
serde_json.workspace = true
schema-model = { path = "crates/schema-model" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
tree-sitter = "0.26"
tree-sitter-ifc = "0.1.0"
